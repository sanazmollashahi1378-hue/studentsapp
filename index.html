<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فانوس مطالعاتی</title>
<style>
:root{
  --ink:#1D2350; --ink2:#2B3470; --paper:#F2F4FA; --card:#FFFFFF; --line:#DDE1EF;
  --amber:#F0A32F; --amber-d:#B97500; --amber-bg:#FFF3DC; --mint:#2E9C8A; --rose:#CF4B4B;
  --text:#1B1F3A; --muted:#6A708F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#0F1330; --ink2:#232A5E; --paper:#0E1126; --card:#181D3D; --line:#2A3060;
    --amber:#F5B04A; --amber-d:#F5B04A; --amber-bg:#3A2D12; --mint:#52C2AE; --rose:#F0807F;
    --text:#E9ECFA; --muted:#9AA1C7; color-scheme: dark; }
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,"Vazir",Tahoma,"Segoe UI",sans-serif;background:var(--paper);color:var(--text);line-height:1.7;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
header.top{background:var(--ink);color:#fff;padding:18px 18px 22px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:18px;letter-spacing:0}
.brand small{display:block;opacity:.7;font-size:12px;margin-top:-4px}
.roles{display:flex;gap:6px;margin-top:14px;background:rgba(255,255,255,.1);padding:4px;border-radius:14px}
.roles button{flex:1;padding:8px;border-radius:10px;color:#fff;opacity:.75;font-weight:600}
.roles button[aria-pressed=true]{background:var(--amber);color:#2A1A00;opacity:1}
main{padding:18px}
h2{font-size:19px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{padding:11px 16px;border-radius:12px;font-weight:700;background:var(--amber);color:#2A1A00}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--amber-bg);color:var(--amber-d)}
.chip.ok{background:rgba(46,156,138,.15);color:var(--mint)}
.chip.no{background:rgba(207,75,75,.14);color:var(--rose)}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--ink2);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.days button{flex:none;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.days button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.days small{display:block;font-size:11px;opacity:.7;font-weight:400}
.tl{position:relative;padding-right:22px}
.tl:before{content:"";position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.part{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.part:before{content:"";position:absolute;right:-20px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--amber));border:3px solid var(--paper)}
.part.done{opacity:.6}
.part.done .ptitle{text-decoration:line-through}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptitle{font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;padding:1px 9px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=time],select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13px}
.opt[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.tabs{position:fixed;bottom:0;right:0;left:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:10px 4px 12px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button[aria-current=page]{color:var(--ink2)}
nav.tabs button[aria-current=page] span{background:var(--amber-bg)}
nav.tabs span{display:block;width:46px;margin:0 auto 2px;border-radius:99px;font-size:17px;padding:2px 0}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,35,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.sheet h3{font-size:17px;margin-bottom:6px}
.tree details{margin:4px 0}
.tree summary{padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:600;list-style:none;background:var(--paper)}
.tree summary::-webkit-details-marker{display:none}
.tree .leaf{display:flex;width:100%;text-align:right;padding:8px 14px;border-radius:10px;font-size:14px}
.tree .leaf:hover,.tree .leaf[aria-pressed=true]{background:var(--amber-bg)}
.tree .lvl{padding-right:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--mint));border-radius:99px}
table.wk{width:100%;border-collapse:collapse;font-size:13px}
table.wk th,table.wk td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
table.wk th{background:var(--paper)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;font-size:14px;max-width:90%}
.warn{background:rgba(207,75,75,.12);color:var(--rose);padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:12px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-variant-numeric:tabular-nums;font-size:16px}
.stats span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:12px;color:var(--muted)}
.cal button{aspect-ratio:1;border-radius:10px;font-size:13px;background:var(--paper);border:1.5px solid transparent;font-variant-numeric:tabular-nums}
.cal button[aria-pressed=true]{border-color:var(--ink);font-weight:800}
.l1{background:#D3EEE8!important}.l2{background:#A8DDD1!important}.l3{background:#7CCBBB!important}.l4{background:#4DB3A0!important;color:#fff}.l5{background:#1F7F6F!important;color:#fff}
.legend{display:flex;gap:0;margin-top:10px;font-size:11px;text-align:center}.legend i{flex:1;padding:3px 0;font-style:normal}
.timer{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.timer .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center}
.seg{display:flex;background:var(--paper);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hbar{height:22px;background:var(--paper);border-radius:8px;overflow:hidden;flex:1}.hbar i{display:block;height:100%;background:var(--mint)}

.steps{display:flex;gap:6px;margin:0 0 4px}
.steps button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600;padding:6px 2px;border-bottom:3px solid var(--line)}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--text)}
.steps button[aria-current=step]{color:var(--text);border-color:var(--amber)}
.steps button[aria-current=step] i{background:var(--amber);color:#2A1A00}
.tbrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tbb{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tbb span{font-size:18px}
.badge{display:inline-grid;place-items:center;min-width:44px;padding:2px 10px;border-radius:99px;background:var(--c,var(--mint));color:#fff;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.scard{border-right:6px solid var(--c)}
.icard .row{gap:8px}
.chipbtn{padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(47,120,181,.16);color:#2F78B5}
.chipbtn.ok{background:rgba(46,156,138,.15);color:var(--mint)}
.num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--mint);color:#fff;font-size:11px;margin-right:4px}
.opt[aria-pressed=true]:has(.num){background:rgba(46,156,138,.18);color:var(--text);border-color:var(--mint)}
.opt.dashed{border-style:dashed;color:var(--mint)}
.sum{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--mint);font-weight:700;font-size:14px}
.leaf.row{align-items:center}

.sub-row{padding:12px 0;border-top:1px solid var(--line)}
.subsec{margin:14px 0 2px;font-weight:700;color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fg .w2{grid-column:1/-1}.fg input{padding:8px 6px;text-align:center}.fg .w2 input{text-align:right;padding:8px 12px}
.gn{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#2A1A00;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.slotc{margin-top:12px}
.msg{padding:10px 12px;border-radius:12px;background:var(--paper);margin-top:8px}.msg.unread{border-right:4px solid var(--amber);background:var(--amber-bg)}
.cols{display:flex;gap:6px;align-items:flex-end;height:150px;margin-top:12px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col i{display:block;width:100%;min-height:2px;background:var(--mint);border-radius:6px 6px 0 0}.col .cv{font-size:11px;font-variant-numeric:tabular-nums}.col .cl{font-size:11px;color:var(--muted)}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none;margin-left:14px}
.donut:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--card)}.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-weight:800}

.clrow{padding:10px 0;border-top:1px solid var(--line)}.clrow.okrow{background:rgba(46,156,138,.07);border-radius:10px;padding:10px 8px}
.ck2{flex:1;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;cursor:pointer;background:var(--card)}
.ck2 input{width:18px;height:18px;flex:none}.ck2.on{border-color:var(--mint);background:rgba(46,156,138,.12)}
nav.tabs button{font-size:11px;padding-left:2px;padding-right:2px}nav.tabs span{width:40px}
.clbook summary{list-style:none}.clbook summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
</style>
</head>
<body>
<div id="app"></div>
<script>
// status: official = از PDF رسمی کتاب | doc = از سند سرفصل‌های ارسالی (نیازمند تطبیق نهایی) | empty = خالی
const SUBJECTS = [
  { id: 'zist', name: 'زیست‌شناسی', color: '#2E9C6A' },
  { id: 'fizik', name: 'فیزیک', color: '#E0A526' },
  { id: 'shimi', name: 'شیمی', color: '#8A5CC2' },
  { id: 'riazi', name: 'ریاضی', color: '#E07B39' },
  { id: 'zamin', name: 'زمین‌شناسی', color: '#2F78B5' },
  { id: 'farsi', name: 'فارسی', color: '#C94B6D' },
  { id: 'din', name: 'دین و زندگی', color: '#8C6246' },
  { id: 'arabi', name: 'عربی', color: '#2A8FA8' },
  { id: 'english', name: 'زبان انگلیسی', color: '#5B6BC0' }
];

// هر خط با # یک فصل است و خط‌های بعدی درس/گفتار/بخش همان فصل
function B(id, name, grade, status, text){
  const chapters = [];
  (text || '').trim().split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    if(line[0] === '#') chapters.push({ t: line.slice(1).trim(), l: [] });
    else if(chapters.length) chapters[chapters.length - 1].l.push(line);
  });
  return { id, name, grade, status, chapters };
}

const DEFAULT_CURRICULUM = {
  zist: [
    B('zist1', 'زیست‌شناسی ۱', 'دهم', 'doc', `
# فصل ۱: دنیای زنده
گفتار ۱: زیست‌شناسی چیست؟
گفتار ۲: گستره حیات
گفتار ۳: یاخته و بافت در بدن انسان
# فصل ۲: گوارش و جذب مواد
گفتار ۱: ساختار و عملکرد لوله گوارش
گفتار ۲: جذب مواد و تنظیم فعالیت دستگاه گوارش
گفتار ۳: تنوع گوارش در جانداران
# فصل ۳: تبادلات گازی
گفتار ۱: سازوکار دستگاه تنفس در انسان
گفتار ۲: تهویه ششی
گفتار ۳: تنوع تبادلات گازی
# فصل ۴: گردش مواد در بدن
گفتار ۱: قلب
گفتار ۲: رگ‌ها
گفتار ۳: خون
گفتار ۴: تنوع گردش مواد در جانداران
# فصل ۵: تنظیم اسمزی و دفع مواد زائد
گفتار ۱: همایستایی و کلیه‌ها
گفتار ۲: تشکیل ادرار و تخلیه آن
گفتار ۳: تنوع دفع و تنظیم اسمزی در جانداران
# فصل ۶: از یاخته تا گیاه
گفتار ۱: ویژگی‌های یاخته گیاهی
گفتار ۲: سامانه‌های بافتی
گفتار ۳: ساختار گیاهان
# فصل ۷: جذب و انتقال مواد در گیاهان
گفتار ۱: تغذیه گیاهی
گفتار ۲: جانداران مؤثر در تغذیه گیاهی
گفتار ۳: انتقال مواد در گیاهان`),
    B('zist2', 'زیست‌شناسی ۲', 'یازدهم', 'doc', `
# فصل ۱: تنظیم عصبی
گفتار ۱: یاخته‌های بافت عصبی
گفتار ۲: ساختار دستگاه عصبی
# فصل ۲: حواس
گفتار ۱: گیرنده‌های حسی
گفتار ۲: حواس ویژه
گفتار ۳: گیرنده‌های حسی جانوران
# فصل ۳: دستگاه حرکتی
گفتار ۱: استخوان‌ها و اسکلت
گفتار ۲: ماهیچه و حرکت
# فصل ۴: تنظیم شیمیایی
گفتار ۱: ارتباط شیمیایی
گفتار ۲: غده‌های درون‌ریز
# فصل ۵: ایمنی
گفتار ۱: نخستین خط دفاعی: ورود ممنوع
گفتار ۲: دومین خط دفاعی: واکنش‌های عمومی اما سریع
گفتار ۳: سومین خط دفاعی: دفاع اختصاصی
# فصل ۶: تقسیم یاخته
گفتار ۱: فامتن (کروموزوم)
گفتار ۲: رشتمان (میتوز) و چرخه یاخته‌ای
گفتار ۳: کاستمان (میوز) و تولید مثل جنسی
# فصل ۷: تولید مثل
گفتار ۱: دستگاه تولید مثل در مرد
گفتار ۲: دستگاه تولید مثل در زن
گفتار ۳: رشد و نمو جنین
گفتار ۴: تولید مثل در جانوران
# فصل ۸: تولید مثل نهاندانگان
گفتار ۱: تولید مثل غیرجنسی
گفتار ۲: تولید مثل جنسی
گفتار ۳: از یاخته تخم تا گیاه
# فصل ۹: پاسخ گیاهان به محرک‌ها
گفتار ۱: تنظیم‌کننده‌های رشد در گیاهان
گفتار ۲: پاسخ به محیط`),
    B('zist3', 'زیست‌شناسی ۳', 'دوازدهم', 'doc', `
# فصل ۱: مولکول‌های اطلاعاتی
گفتار ۱: نوکلئیک اسیدها
گفتار ۲: همانندسازی دنا
گفتار ۳: پروتئین‌ها
# فصل ۲: جریان اطلاعات در یاخته
گفتار ۱: رونویسی
گفتار ۲: به سوی پروتئین
گفتار ۳: تنظیم بیان ژن
# فصل ۳: انتقال اطلاعات در نسل‌ها
گفتار ۱: مفاهیم پایه
گفتار ۲: انواع صفات
# فصل ۴: تغییر در اطلاعات وراثتی
گفتار ۱: تغییر در ماده وراثتی جانداران
گفتار ۲: تغییر در جمعیت‌ها
گفتار ۳: تغییر در گونه‌ها
# فصل ۵: از ماده به انرژی
گفتار ۱: تأمین انرژی
گفتار ۲: اکسایش بیشتر
گفتار ۳: زیستن مستقل از اکسیژن
# فصل ۶: از انرژی به ماده
گفتار ۱: فتوسنتز: تبدیل انرژی نور به انرژی شیمیایی
گفتار ۲: واکنش‌های فتوسنتزی
گفتار ۳: فتوسنتز در شرایط دشوار
# فصل ۷: فناوری‌های نوین زیستی
گفتار ۱: زیست‌فناوری و مهندسی ژنتیک
گفتار ۲: فناوری مهندسی پروتئین و بافت
گفتار ۳: کاربردهای زیست‌فناوری
# فصل ۸: رفتارهای جانوران
گفتار ۱: اساس رفتار
گفتار ۲: انتخاب طبیعی و رفتار
گفتار ۳: ارتباط و زندگی گروهی`)
  ],
  fizik: [
    B('fizik1', 'فیزیک ۱', 'دهم', 'doc', `
# فصل ۱: فیزیک و اندازه‌گیری
۱-۱ فیزیک: دانش بنیادی
۱-۲ مدل‌سازی در فیزیک
۱-۳ اندازه‌گیری و کمیت‌های فیزیکی
۱-۴ اندازه‌گیری و دستگاه بین‌المللی یکاها (SI)
۱-۵ اندازه‌گیری و دقت وسیله‌های اندازه‌گیری
۱-۶ چگالی
# فصل ۲: ویژگی‌های فیزیکی مواد
۲-۱ حالت‌های ماده
۲-۲ نیروهای بین مولکولی
۲-۳ فشار در شاره‌ها

async function boot(){
  S.token = LS.get(LSK + '-token');
  if(S.token){
    try{ S.user = await api('me'); S.beVersion = S.user.version || 0; S.role = S.user.role; S.view = S.role === 'student' ? 'mine' : 'students'; await loadData(true); }
    catch(e){ if(e.message !== 'unauth') S.bootErr = errMsg(e); S.user = e.message === 'unauth' ? null : S.user; }

}
function genPass(){
  const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint32Array(10); crypto.getRandomValues(r);
  return [...r].map(x => a[x % a.length]).join('');
}

const lvl = h => h <= 0 ? '' : h < 3 ? 'l1' : h < 6 ? 'l2' : h < 9 ? 'l3' : h < 12 ? 'l4' : 'l5';
function viewReport(stId, canAdd){
  const mode = S.rep.mode, sel = fromIso(S.rep.date);
  const mine = S.sessions.filter(x => x.st === stId);
  const byDay = {}; mine.forEach(x => byDay[x.date] = (byDay[x.date] || 0) + x.useful);
  const dayTotal = k => byDay[k] || 0;
  // ماه جاری شمسی
  const pm = pparts(sel); let first = new Date(sel); while(pparts(addDays(first, -1)).day < pparts(first).day && pparts(addDays(first, -1)).month === pm.month) first = addDays(first, -1);
  while(pparts(first).day !== 1) first = addDays(first, -1);
  const cells = []; for(let d = new Date(first); pparts(d).month === pm.month; d = addDays(d, 1)) cells.push(new Date(d));
  const lead = dayIdx(first);
  const cal = `<div class="cal">${['ش','ی','د','س','چ','پ','ج'].map(h => `<span class="h">${h}</span>`).join('')}${Array(lead).fill('<span></span>').join('')}
    ${cells.map(d => { const k = iso(d); return `<button data-rd="${k}" class="${lvl(dayTotal(k) / 3600)}" aria-pressed="${k === S.rep.date}" aria-label="${fullFa(d)}">${fa(pparts(d).day)}</button>`; }).join('')}</div>
    <div class="legend"><i class="l1">۰–۳</i><i class="l2">۳–۶</i><i class="l3">۶–۹</i><i class="l4">۹–۱۲</i><i class="l5">+۱۲</i></div>`;
  // آمار بالا
  const last7 = Array.from({ length: 7 }, (_, i) => dayTotal(iso(addDays(new Date(), -i))));
  const record = Math.max(0, ...Object.values(byDay));
  const todays = mine.filter(x => x.date === iso(new Date())).sort((a, b) => a.start.localeCompare(b.start));
  const top = `<div class="card"><div class="stats"><div><b>${todays.length ? fa(todays[0].start) : '—'}</b><span>شروع امروز</span></div><div><b>${todays.length ? fa(todays[todays.length - 1].end) : '—'}</b><span>پایان امروز</span></div>
    <div><b>${hms(record)}</b><span>رکورد مطالعه</span></div></div><div class="row" style="margin-top:10px"><span class="grow sub" style="margin:0">میانگین مطالعات هفتگی</span><b>${hms(last7.reduce((a, b) => a + b, 0) / 7)}</b></div></div>`;
  let mid = '';
  if(mode === 'day'){
    const k = S.rep.date, rows = mine.filter(x => x.date === k).sort((a, b) => a.start.localeCompare(b.start));
    const tot = rows.reduce((a, x) => a + x.total, 0), use = rows.reduce((a, x) => a + x.useful, 0);
    mid = `<div class="card">${cal}</div>
    <div class="card"><h2 style="text-align:center;font-size:16px">${fullFa(sel)}</h2><div class="stats" style="margin-top:8px"><div><b>${rows.length ? fa(rows[0].start) : '۰۰:۰۰:۰۰'}</b><span>شروع</span></div><div><b>${rows.length ? fa(rows[rows.length - 1].end) : '۰۰:۰۰:۰۰'}</b><span>پایان</span></div><div><b>${hms(tot)}</b><span>مطالعه کل</span></div></div></div>
    <div class="card"><b>گزارش دروس مطالعه‌شده</b>
    ${rows.length ? `<div style="overflow:auto;margin-top:8px"><table class="wk"><tr><th>درس</th><th>مبحث</th><th>مدت</th><th>مفید</th><th>شروع</th><th>پایان</th><th>تستی</th><th>تشریحی</th></tr>
      ${rows.map(x => `<tr><td>${subj(x.subject).name}</td><td>${esc(x.topic) || '—'}</td><td>${hms(x.total)}</td><td>${hms(x.useful)}</td><td>${fa(x.start)}</td><td>${fa(x.end)}</td><td>${fa(x.tests)}</td><td>${fa(x.desc)}</td></tr>`).join('')}</table></div>
      <p class="sub" style="margin-top:8px">مطالعهٔ مفید ${hms(use)} از ${hms(tot)}</p>` : '<div class="empty">هیچ درسی در این روز مطالعه نشده است.</div>'}</div>`;
  } else if(mode === 'week'){
    const ws = weekStart(sel), days = Array.from({ length: 7 }, (_, i) => addDays(ws, i)), max = Math.max(1, ...days.map(d => dayTotal(iso(d))));
    const tot = days.reduce((a, d) => a + dayTotal(iso(d)), 0);
    mid = `<div class="card"><b>هفتهٔ ${fullFa(ws)}</b>${days.map((d, i) => `<div class="row" style="margin-top:10px"><span style="width:70px;font-size:13px">${DAYS[i]}</span><div class="hbar"><i style="width:${dayTotal(iso(d)) / max * 100}%"></i></div><span style="width:88px;font-size:12px;text-align:left">${hms(dayTotal(iso(d)))}</span></div>`).join('')}
    <p class="sub" style="margin-top:12px">جمع هفته: ${hm(tot)}</p></div>`;
  } else {
    const days = cells.map(d => dayTotal(iso(d))), tot = days.reduce((a, b) => a + b, 0), act = days.filter(x => x > 0).length;
    mid = `<div class="card"><b>${monthFa(sel)}</b><div style="margin-top:10px">${cal}</div></div>
    <div class="card stats"><div><b>${hm(tot)}</b><span>جمع ماه</span></div><div><b>${fa(act)} روز</b><span>روز مطالعه</span></div><div><b>${act ? hm(tot / act) : '—'}</b><span>میانگین روز فعال</span></div></div>`;
  }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const curWeekKey = () => iso(weekStart(new Date()));

const planRO = (stId, week) => (S.plans[stId] && S.plans[stId][week]) || newPlan();
const planRW = (stId, week) => { S.plans[stId] = S.plans[stId] || {}; return S.plans[stId][week] = S.plans[stId][week] || newPlan(); };
const stDef = st => Object.assign({ endDay: 5, start: '09:00', dur: 90, brk: 15, showTime: true }, (st && st.defaults) || {});
const weekDate = (week, i) => addDays(fromIso(week), i);
const dayShort = (week, i) => new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long' }).format(weekDate(week, i));
const dayLabel = (week, i) => DAYS[i] + ' ' + dayShort(week, i);
const shiftWeek = (week, n) => iso(addDays(fromIso(week), n * 7));
const weekTitle = (week, endDay) => fullFa(weekDate(week, 0)) + ' تا ' + fullFa(weekDate(week, endDay));
const flatParts = pl => Object.entries(pl.days).flatMap(([d, arr]) => arr.map(p => ({ ...p, d: +d })));
const partLabel = p => DAYS[p.d] + ' • ' + fa(p.start) + ' تا ' + fa(endOf(p));
const itemsOfPart = (pl, pid) => pl.items.filter(it => it.partIds.includes(pid));
const totalCount = (pl, sid) => flatParts(pl).filter(p => p.subject === sid).length;
const assignedCount = (pl, sid) => flatParts(pl).filter(p => p.subject === sid && pl.items.some(it => it.partIds.includes(p.id))).length;
const itemSummary = it => it.tasks.join(' + ');
const leafOf = path => path.split(' › ').pop();
const locked = pl => { if(pl.published){ toast('برنامهٔ این هفته منتشر شده است؛ برای تغییر آن باید اول بازگشایی شود.'); return true; } return false; };
function nextStart(parts, d){
  if(!parts.length) return d.start;
  const last = parts.reduce((a, b) => toMin(a.start) > toMin(b.start) ? a : b);
  return toTime(toMin(last.start) + last.dur + d.brk);
}
function pathOf(sid, key){
  const [bi, ci, li] = key.split('|').map(Number), b = S.curriculum[sid][bi], c = b.chapters[ci];
  return li < 0 ? b.name + ' › ' + c.t : b.name + ' › ' + c.t + ' › ' + c.l[li];
}
function treeChecks(sid, checked){

}

function partSheet(stId, partId){

  const draw = () => openSheet(`<h3>${ex ? 'ویرایش پارت' : 'پارت جدید'} · ${dayLabel(S.week, S.day)}</h3>

    <div class="row" style="margin-top:16px"><button class="btn grow" id="ok">ذخیره پارت</button>${ex ? '<button class="btn danger" id="del">حذف</button>' : ''}</div>`, el => {

    el.querySelector('#ok').onclick = () => {
      keep();

      if(clash && !confirm('این پارت با یکی از پارت‌های همین روز هم‌پوشانی دارد. ذخیره شود؟')) return;
      closeSheet();

        const pl = planRW(stId, S.week), arr = pl.days[S.day], i = arr.findIndex(x => x.id === p.id);
        if(i >= 0){ const was = arr[i].subject; arr[i] = { id: p.id, start: p.start, dur: p.dur, subject: p.subject }; if(was !== p.subject) pl.items.forEach(it => { it.partIds = it.partIds.filter(x => x !== p.id); }); }
        else arr.push({ id: p.id, start: p.start, dur: p.dur, subject: p.subject });
        arr.sort((a, b) => toMin(a.start) - toMin(b.start));

    };

    if(del) del.onclick = () => { closeSheet(); set(() => { const pl = planRW(stId, S.week); pl.days[S.day] = pl.days[S.day].filter(x => x.id !== p.id); pl.items.forEach(it => { it.partIds = it.partIds.filter(x => x !== p.id); }); }); toast('پارت حذف شد'); };

  draw();
}

function copyWeek(stId, src){
  const from = planRO(stId, src), cur = planRO(stId, S.week);
  if(locked(cur)) return;
  if(flatParts(cur).length && !confirm('برنامهٔ فعلی این هفته با برنامهٔ انتخابی جایگزین شود؟')) return;
  const map = {}, pl = newPlan();
  for(let i = 0; i < 7; i++) pl.days[i] = from.days[i].map(p => { const id = uid(); map[p.id] = id; return { id, start: p.start, dur: p.dur, subject: p.subject }; });
  pl.items = from.items.map(it => ({ ...JSON.parse(JSON.stringify(it)), id: uid(), partIds: it.partIds.map(x => map[x]).filter(Boolean) }));
  if(from.exam) pl.exam = { ...JSON.parse(JSON.stringify(from.exam)), registered: false };
  set(() => { S.plans[stId][S.week] = pl; }); toast('برنامه کپی شد');
}

const stripPlan = pl => ({ published: !!pl.published, days: Object.fromEntries(Object.entries(pl.days).map(([k, v]) => [k, v.map(({ id, start, dur, subject }) => ({ id, start, dur, subject }))])), items: pl.items || [], exam: pl.exam || null, advisorNote: pl.advisorNote || '' });
// ================= پنل دانش‌آموز (بر پایهٔ tracker) + پیام/محتوا + چاپ برنامه =================
const GROUPS = [['📗 دروس اختصاصی', ['zist', 'fizik', 'shimi', 'riazi', 'zamin']], ['📘 دروس عمومی', ['farsi', 'din', 'arabi', 'english']]];
const SLOTS = [['s1', '🌅 ۸ صبح تا ۱۲ ظهر'], ['s2', '☀️ ۱۲ ظهر تا ۴ عصر'], ['s3', '🌆 ۴ عصر تا ۸ شب'], ['s4', '🌙 ۸ شب تا ۱۲ شب']];

const CTYPES = { voice: '🎙️ ویس', video: '🎬 ویدیو', pdf: '📄 PDF', text: '📝 متن', link: '🔗 لینک' };
const en = s => String(s == null ? '' : s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.');
const num = s => parseFloat(en(s)) || 0;
const safeUrl = u => /^https?:\/\/[^\s"'<>]+$/i.test(String(u)) ? String(u) : '#';
const wkOf = date => iso(weekStart(fromIso(date)));
const dayHours = d => Object.values((d && d.subjects) || {}).reduce((a, s) => a + (+s.hours || 0), 0);
const dayTests = d => Object.values((d && d.subjects) || {}).reduce((a, s) => a + (+s.total || 0), 0);
const r1 = n => Math.round(n * 10) / 10;
const streakEm = d => !d ? '○' : d.quality === 'great' ? '⭐' : d.quality === 'avg' ? '✅' : d.quality === 'weak' ? '⚠️' : dayHours(d) > 0 ? '✏️' : '○';
const me = () => stOf(S.loggedStudent) || S.students[0];
const dayRW = date => (S.logs[date] = S.logs[date] || {});
const dateFa = date => fullFa(fromIso(date));
function plannedHours(stId, date){
  const pl = planRO(stId, wkOf(date)), out = {};
  (pl.days[dayIdx(fromIso(date))] || []).forEach(p => { out[p.subject] = (out[p.subject] || 0) + p.dur / 60; });
  Object.keys(out).forEach(k => { out[k] = Math.round(out[k] * 100) / 100; });
  return out;
}

// ---------- بارگذاری و همگام‌سازی ----------
async function loadData(first){
  let cfgMissing = false;
  const fix = (pl, done) => { pl.items = pl.items || []; pl.exam = pl.exam || null; pl.advisorNote = pl.advisorNote || ''; mergeDone(pl, done); return pl; };
  if(S.user.role === 'consultant'){
    const d = await api('getAll');
    if(d.config.curriculum) S.curriculum = d.config.curriculum; else cfgMissing = true;
    if(d.config.defaults) S.defaults = d.config.defaults;
    S.students = d.students.map(s => { const m = d.meta[s.id] || {}, pr = d.prog[s.id] || {};
      return { id: s.id, name: s.name, grade: s.grade, username: s.username, routines: m.routines || defaultRoutines(), res: m.res || {}, defaults: m.defaults || null, clGrades: m.clGrades || null, rdone: pr.rdone || {} }; });
    S.cls = d.cl || {};
    S.plans = {}; d.students.forEach(s => { S.plans[s.id] = {}; Object.entries(d.plans[s.id] || {}).forEach(([w, pl]) => { S.plans[s.id][w] = fix(pl, (d.prog[s.id] || {}).done); }); });
    S.sessions = d.sessions;
  } else {
    const d = await api('getMine', { weeks: [curWeekKey(), shiftWeek(curWeekKey(), -1)] });
    S.students = [{ id: d.me.id, name: d.me.name, grade: d.me.grade, routines: (d.meta || {}).routines || [], res: (d.meta || {}).res || {}, defaults: (d.meta || {}).defaults || null, clGrades: (d.meta || {}).clGrades || null, rdone: (d.prog || {}).rdone || {} }];
    S.cl = d.checklist || {};
    S.loggedStudent = d.me.id; S.plans = { [d.me.id]: {} };
    Object.entries(d.plans || {}).forEach(([w, pl]) => { S.plans[d.me.id][w] = fix(pl, (d.prog || {}).done); });
    S.sessions = d.sessions; S.logs = d.logs || {}; S.rank = d.rank || null; S.unread = d.unread || 0; S.cname = d.consultant || '';
    S.day = dayIdx(new Date());
  }
  if(first) restoreLocal();
  markSynced(); if(cfgMissing) delete synced.cfg;
}
function sections(){
  const m = {};
  if(!S.user) return m;
  if(S.user.role === 'consultant'){
    S.students.forEach(st => {
      m['meta:' + st.id] = { action: 'saveMeta', payload: { studentId: st.id, meta: { routines: st.routines, res: st.res, defaults: st.defaults || null, clGrades: st.clGrades || null } } };
      Object.entries(S.plans[st.id] || {}).forEach(([w, pl]) => { m['plan:' + st.id + ':' + w] = { action: 'savePlan', payload: { studentId: st.id, week: w, plan: stripPlan(pl) } }; });
    });
    m.cfg = { action: 'saveConfig', payload: { curriculum: S.curriculum, defaults: S.defaults } };   // آخر: برنامه‌ها اول ذخیره شوند
  } else if(S.students[0]){
    const st = S.students[0], pl = (S.plans[st.id] || {})[curWeekKey()], done = {}, scope = [], rdone = {}, cutoff = iso(addDays(new Date(), -90));
    if(pl) flatParts(pl).forEach(p => { scope.push(p.id); if(p.done) done[p.id] = true; });
    Object.entries(st.rdone || {}).forEach(([k, v]) => { if(v && k.split('|')[0] >= cutoff) rdone[k] = true; });
    m.prog = { action: 'saveProgress', payload: { prog: { done, rdone }, scope } };
    m.cl = { action: 'saveChecklist', payload: { items: S.cl } };
    Object.keys(S.logs).forEach(d => { m['log:' + d] = { action: 'saveDay', payload: { date: d, day: S.logs[d] } }; });
  }
  return m;
}

  const ws = fromIso(wk), days = Array.from({ length: 7 }, (_, i) => iso(addDays(ws, i)));
  const subs = SUBJECTS.map(s => { let h = 0, t = 0, th = 0; days.forEach(k => { const v = ((logs[k] || {}).subjects || {})[s.id] || {}; h += +v.hours || 0; t += +v.total || 0; th += plannedHours(stId, k)[s.id] || 0; }); return { ...s, hours: h, tests: t, target: th }; }).filter(s => s.hours || s.tests || s.target);
  const dh = days.map(k => dayHours(logs[k])), totH = dh.reduce((a, b) => a + b, 0), totT = subs.reduce((a, s) => a + s.tests, 0), great = days.filter(k => (logs[k] || {}).quality === 'great').length, max = Math.max(1, ...dh);
  let acc = 0; const stops = subs.filter(s => s.hours > 0).map(s => { const a = acc / totH * 360; acc += s.hours; return `${s.color} ${a}deg ${acc / totH * 360}deg`; });
  return `<div class="card stats"><div><b>${fa(r1(totH))}</b><span>کل ساعت هفته</span></div><div><b>${fa(totT)}</b><span>کل تست هفته</span></div><div><b>${fa(great)}</b><span>روز عالی 😊</span></div></div>
    <div class="card" style="overflow:auto"><b>📋 جدول هفتگی</b>${subs.length ? `<table class="wk" style="margin-top:8px"><tr><th>درس</th><th>ساعت واقعی</th><th>ساعت هدف</th><th>تست</th></tr>
      ${subs.map(s => `<tr><td><span class="dot" style="background:${s.color};display:inline-block;margin-left:6px"></span>${s.name}</td><td>${fa(r1(s.hours))}</td><td>${s.target ? fa(r1(s.target)) : '—'}</td><td>${fa(s.tests)}</td></tr>
      ${s.target ? `<tr><td colspan="4" style="padding:2px 8px 8px"><div class="bar" style="--c:${s.hours >= s.target ? 'var(--mint)' : 'var(--amber)'}"><i style="width:${Math.min(100, s.hours / s.target * 100)}%"></i></div></td></tr>` : ''}`).join('')}</table>` : '<div class="empty">برای این هفته گزارشی ثبت نشده.</div>'}</div>
    <div class="card"><b>📊 ساعت مطالعه روزانه</b><div class="cols">${dh.map((h, i) => `<div class="col"><span class="cv">${h ? fa(r1(h)) : ''}</span><i style="height:${h / max * 100}%"></i><span class="cl">${DAYS[i].slice(0, 3)}</span></div>`).join('')}</div></div>
    ${stops.length ? `<div class="card"><b>📚 توزیع بین دروس</b><div class="row" style="margin-top:10px;align-items:center"><div class="donut" style="background:conic-gradient(${stops.join(',')})"><span>${fa(r1(totH))}</span></div>
      <div class="grow">${subs.filter(s => s.hours > 0).map(s => `<div class="row" style="padding:2px 0;font-size:13px"><span class="dot" style="background:${s.color}"></span><span class="grow">${s.name}</span><span>${fa(r1(s.hours))}</span></div>`).join('')}</div></div></div>` : ''}`;
}

// ---------- خروجی چاپی (برگرفته از نمونهٔ PDF) ----------
function printPlanHtml(st, week, pl, consultantName){
  const d = stDef(st), days = Array.from({ length: d.endDay + 1 }, (_, i) => i), parts = flatParts(pl), pages = [];
  const rtOn = i => (st.routines || []).filter(r => routineOn(r, i));
  const dotc = sid => `<span class="dt" style="background:${subj(sid).color}"></span>`;
  // گروه‌بندی روزهای هم‌ساختار
  const sig = i => pl.days[i].map(p => p.start + '|' + p.dur + '|' + p.subject).join(';');
  const groups = []; days.forEach(i => { if(!pl.days[i].length) return; const g = groups[groups.length - 1]; if(g && g.sig === sig(i) && g.last === i - 1){ g.days.push(i); g.last = i; } else groups.push({ sig: sig(i), days: [i], last: i }); });
  const overview = groups.map(g => { const ps = pl.days[g.days[0]], rt = rtOn(g.days[0]).filter(r => g.days.every(x => routineOn(r, x)));
    return `<div class="gb"><div class="gd">${g.days.map(i => DAYS[i]).join('<br>')}</div><table class="tb"><tr>${ps.map(p => `<th>${d.showTime ? fa(p.start) + ' تا ' + fa(endOf(p)) : '&nbsp;'}</th>`).join('')}</tr><tr>${ps.map(p => `<td>${dotc(p.subject)}${subj(p.subject).name}</td>`).join('')}</tr></table>
      <div class="rt"><b>مشق شب</b>${rt.map(r => `<div>${esc(r.title)}</div>`).join('') || '—'}</div></div>`; }).join('');
  // پیشروی درس‌ها
  const bySub = SUBJECTS.map(s => ({ s, its: pl.items.filter(it => it.subject === s.id && it.partIds.length) })).filter(x => x.its.length);
  const prog = bySub.map(({ s, its }) => `<div class="pc" style="border-color:${s.color}"><div class="ph" style="color:${s.color}"><b>${s.name}</b><span>${fa(its.length)} مبحث، ${fa(its.reduce((a, it) => a + it.partIds.length, 0))} پارت</span></div>
    <table class="tb2"><tr style="background:${s.color}22"><th>مبحث</th><th>مسیر مطالعه</th><th>تعداد پارت</th></tr>${its.map(it => `<tr><td>${esc(it.title)}</td><td>${esc(it.tasks.join(' + ')) || '—'}</td><td>${fa(it.partIds.length)}</td></tr>`).join('')}</table></div>`);
  // صفحه‌ها
  const cover = `<div class="cv"><div class="lg">${LANTERN}</div><h1>برنامه شخصی تو</h1><div class="pill">برنامه هفتگی</div>

const GEN_SUBJECT = { id: 'general', name: 'دروس عمومی', color: '#6A708F' };
function CLB(id, subject, grade, title, text){
  const sections = []; let n = 0;
  text.trim().split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    if(line[0] === '#') sections.push({ chapter: line.slice(1).trim(), rows: [] });
    else { const [label, ...rest] = line.split('|'); sections[sections.length - 1].rows.push({ id: id + '-' + (++n), label: label.trim(), text: rest.join('|').trim() }); }
  });
  return { id, subject, grade, title, sections };
}

    $('[data-clt]', i => i.onchange = () => { clSet(i.dataset.clt, { t: i.checked }); i.parentElement.classList.toggle('on', i.checked); upd(); const w = i.closest('.clrow'); const x = S.cl[i.dataset.clt] || {}; w.classList.toggle('okrow', !!(x.v && x.t)); });

      if(!sel.length){ c.checked = true; return toast('حداقل یک پایه لازم است.'); } set(() => { st.clGrades = sel; }); });

// ================= همگام‌سازی مقاوم با شیت + تشخیص مشکل =================
const NEED_BE = 6;
let lastErr = null, retryN = 0, retryTimer = null;
Object.assign(ERR, {
  timeout: 'پاسخ سرور خیلی دیر رسید؛ اینترنت را بررسی کن و دوباره امتحان کن.',
  bad_response: 'پاسخ سرور درست نبود. معمولاً یعنی Deploy انجام نشده یا «Who has access» روی Anyone نیست.',
  bad_action: 'این عملیات در بک‌اندِ Deploy شده نیست: Code.gs را جایگزین کن و Deploy ← Manage deployments ← New version بزن.',
  server_error: 'خطای داخلی در Apps Script؛ در ویرایشگر منوی Executions را ببین.',
  sheet_access: 'اسکریپت به شیت دسترسی ندارد.'
});
async function api(action, payload){
  if(API_URL.includes('PASTE_')) throw new Error('no_url');
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, tm = ctl ? setTimeout(() => ctl.abort(), 60000) : null;
  let res;
  try{ res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...payload }), signal: ctl ? ctl.signal : undefined }); }
  catch(e){ throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'network'); }
  finally{ if(tm) clearTimeout(tm); }
  let j; try{ j = await res.json(); }catch(e){ throw new Error('bad_response'); }
  if(!j.ok){ if(j.error === 'unauth' && action !== 'login') doLogout(); throw new Error(j.error || 'server_error'); }
  return j.data;
}
const dirtyKeys = () => { const m = sections(); return Object.keys(m).filter(k => synced[k] !== JSON.stringify(m[k].payload)); };
const pending = () => (S.outbox ? S.outbox.length : 0) + dirtyKeys().length;
function setSync(msg, err){
  syncMsg = msg; syncErr = !!err;
  const el = document.getElementById('syncst'); if(el){ el.textContent = msg; el.style.color = err ? '#FFB4B4' : ''; }
}
function save(){ persistLocal(); clearTimeout(syncTimer); syncTimer = setTimeout(flush, 300); }
async function flush(){
  if(syncing || !S.user) return;
  syncing = true; setSync('در حال ذخیره…');
  let failed = 0; lastErr = null;
  try{
    while(S.outbox.length && S.user){
      const o = S.outbox[0];
      try{ await api(o.action, o.payload); S.outbox.shift(); persistLocal(); }
      catch(e){ if(e.message === 'bad_input'){ S.outbox.shift(); persistLocal(); continue; } failed++; lastErr = { action: o.action, code: e.message }; break; }
    }
    const m = S.user ? sections() : {};
    for(const k in m){
      if(!S.user) break;
      const str = JSON.stringify(m[k].payload);
      if(synced[k] === str) continue;
      try{ await api(m[k].action, m[k].payload); synced[k] = str; }
      catch(e){ failed++; if(!lastErr) lastErr = { action: m[k].action, code: e.message }; }   // خطا در یک بخش، بخش‌های دیگر را متوقف نمی‌کند
    }
  }catch(e){ failed++; lastErr = { action: '?', code: e.message }; }
  syncing = false;
  if(!S.user) return;
  if(failed){
    retryN++;
    setSync('ذخیره نشد (' + fa(pending()) + ' تغییر) · ' + errMsg({ message: lastErr.code }).slice(0, 60) + ' · برای جزئیات بزن', true);
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, [4000, 10000, 30000][Math.min(retryN - 1, 2)]);
  } else {
    retryN = 0; setSync('ذخیره شد ✓');
    if(S.outbox.length || isDirty()) syncTimer = setTimeout(flush, 200);
  }
}
async function flushNow(){
  clearTimeout(syncTimer);
  for(let i = 0; i < 90 && syncing; i++) await new Promise(r => setTimeout(r, 500));
  await flush();
  for(let i = 0; i < 90 && syncing; i++) await new Promise(r => setTimeout(r, 500));
  return !(S.outbox.length || isDirty());
}
function diagSheet(){
  const be = S.beVersion || 0;
  openSheet(`<h3>وضعیت ذخیره‌سازی</h3>
    <div class="card"><div class="row"><b class="grow">نسخهٔ بک‌اندِ Deploy شده</b><span>${be ? fa(be) : 'نامشخص'} (لازم: ${fa(NEED_BE)})</span></div>
      <div class="row" style="margin-top:6px"><b class="grow">تغییرات ذخیره‌نشده</b><span>${fa(pending())}</span></div>
      ${be && be < NEED_BE ? '<div class="warn" style="margin-top:8px">بک‌اند قدیمی است. Code.gs جدید را جایگزین کن و Deploy ← Manage deployments ← New version بزن.</div>' : ''}
      ${lastErr ? `<div class="warn" style="margin-top:8px">آخرین خطا: <b dir="ltr">${esc(lastErr.action)}</b> ← <b dir="ltr">${esc(lastErr.code)}</b><br>${esc(errMsg({ message: lastErr.code }))}</div>` : '<div class="sub" style="margin:8px 0 0">خطایی ثبت نشده.</div>'}</div>
    <button class="btn block" id="dresend">ارسال دوبارهٔ همهٔ اطلاعات</button>
    ${S.role === 'consultant' ? '<button class="btn sec block" id="dtest" style="margin-top:8px">تست اتصال به شیت</button>' : ''}
    <div id="dres"></div><button class="btn sec block" id="dclose" style="margin-top:8px">بستن</button>`, el => {
    el.querySelector('#dclose').onclick = closeSheet;
    el.querySelector('#dresend').onclick = () => { Object.keys(synced).forEach(k => delete synced[k]); closeSheet(); toast('در حال ارسال…'); flushNow().then(ok => toast(ok ? 'همه‌چیز روی سرور ذخیره شد ✓' : 'هنوز ذخیره نشد؛ وضعیت بالای صفحه را ببین.')); };
    const t = el.querySelector('#dtest');
    if(t) t.onclick = async () => { const box = el.querySelector('#dres'); box.innerHTML = '<div class="sub">در حال تست…</div>';
      try{ const r = await api('selfTest'); box.innerHTML = `<div class="card" style="margin-top:8px"><b>${r.readWrite ? '✅ خواندن و نوشتن در شیت درست است' : '⚠️ خواندن بعد از نوشتن ناموفق بود'}</b><div class="sub" style="margin:6px 0 0">شیت: <span dir="ltr">${esc(r.sheet)}</span> · ${fa(r.ms)} میلی‌ثانیه · برگه‌ها: <span dir="ltr">${esc((r.sheets || []).join(', '))}</span></div></div>`; }
      catch(e){ box.innerHTML = `<div class="warn" style="margin-top:8px">${esc(e.message)}: ${esc(errMsg(e))}</div>`; } };
  });
}
const bindSync0 = bind;
bind = function(){
  bindSync0();
  const e = document.getElementById('syncst'); if(e){ e.style.cursor = 'pointer'; e.onclick = diagSheet; }
};
window.addEventListener('beforeunload', ev => { if(S.user && (S.outbox.length || isDirty())){ ev.preventDefault(); ev.returnValue = ''; } });
window.addEventListener('pagehide', () => {
  if(!S.user || API_URL.indexOf('http') !== 0 || !navigator.sendBeacon) return;
  try{
    const m = sections();
    (S.outbox || []).forEach(o => navigator.sendBeacon(API_URL, JSON.stringify({ action: o.action, token: S.token, ...o.payload })));
    Object.keys(m).forEach(k => { if(synced[k] !== JSON.stringify(m[k].payload)) navigator.sendBeacon(API_URL, JSON.stringify({ action: m[k].action, token: S.token, ...m[k].payload })); });
  }catch(e){}
});


boot();
